# ==================== 应用基础配置 ====================
# 应用名称：用于日志、监控中标识本服务
spring.application.name=Java1234 RAG

# 服务端口：后端 HTTP 服务监听端口，前端请求地址需与此一致
server.port=8080

# ==================== 数据源配置（MySQL） ====================
# 数据库连接地址：库名 db_java1234_rag，URL 参数说明：
#   characterEncoding=utf8       —— 连接使用 UTF-8 编码，避免中文乱码
#   serverTimezone=Asia/Shanghai —— 指定时区为东八区（上海）
#   allowPublicKeyRetrieval=true —— MySQL 8 caching_sha2_password 认证方式所需
#   useSSL=false                 —— 本地开发环境不启用 SSL
spring.datasource.url=jdbc:mysql://localhost:3306/db_java1234_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
# 数据库用户名（请按实际环境修改）
spring.datasource.username=root
# 数据库密码（请按实际环境修改；生产环境建议通过环境变量或配置中心注入）
spring.datasource.password=123
# MySQL 8.x 官方 JDBC 驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis 配置 ====================
# Mapper XML 扫描路径：resources/mapper 目录下的所有 XML 映射文件
mybatis.mapper-locations=classpath:mapper/**/*.xml
# 下划线自动转驼峰：数据库字段 user_name 自动映射为 Java 属性 userName
mybatis.configuration.map-underscore-to-camel-case=true
# SQL 日志输出实现：通过 SLF4J 打印，可配合 logging.level 控制输出级别
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ==================== Redis 配置 ====================
# Redis 主机地址
spring.data.redis.host=localhost
# Redis 端口：使用 Docker 中的 Redis Stack（含 RediSearch 模块，支持 FT.* 向量检索命令），
# 本机 6379 是旧版 Redis 3.0（无 RediSearch），不可用于向量存储；
# 容器启动命令：docker run -d --name redis-stack-rag -p 6380:6379 --restart unless-stopped redis/redis-stack-server:latest
spring.data.redis.port=6380
# 使用的 Redis 数据库索引（0~15），向量存储同样使用该库
spring.data.redis.database=0

# ==================== Ollama 大模型配置（Spring AI） ====================
# Ollama 服务地址（需先在本地启动 Ollama，并拉取下方配置的两个模型）
spring.ai.ollama.base-url=http://localhost:11434
# 对话（Chat）模型：用于知识问答生成回答
spring.ai.ollama.chat.options.model=qwen3:4b
# 向量化（Embedding）模型：用于文档分块后的向量化入库
spring.ai.ollama.embedding.options.model=dengcao/Qwen3-Embedding-4B:Q4_K_M

# ==================== Spring AI ChatClient 日志配置 ====================
# 开启 Advisor 链路 DEBUG 日志，可查看 RAG 检索增强前后的请求/响应内容
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

# ==================== Redis 向量存储配置 ====================
# 向量索引名称（RediSearch 索引），需保持全局唯一
spring.ai.vectorstore.redis.index-name=java1234_rag_idx
# 向量数据 key 前缀：所有文档向量均以该前缀存储在 Redis 中
spring.ai.vectorstore.redis.prefix=java1234_rag:
# 启动时自动创建索引结构（首次部署建议开启）
spring.ai.vectorstore.redis.initialize-schema=true
# 删除文档时 SCAN 使用的 key 前缀（多个用逗号分隔）；留空则默认包含上方 prefix 及历史遗留的 embedding: 前缀
#spring.ai.vectorstore.redis.delete-scan-prefixes=java1234_rag:,embedding:

# ==================== 文件上传配置 ====================
# 上传文件在服务器上的存储目录（请按本机实际路径修改）
# 注意：路径中的中文必须使用 \uXXXX 转义书写，因为 Spring Boot 运行时默认按 ISO-8859-1 读取 properties 值，明文中文会乱码；
# 转义后的实际路径为：E:/java1234/基于Spring AI 2.0的RAG企业内部知识库问答Agent系统 项目实战/项目源码，数据库脚本，知识库测试文件/项目源码，数据库脚本，知识库测试文件/uploads3
file.upload.path=E:/java1234/RAG_Knowledge_ Agent_System/RAG_Knowledge_ Agent_System_1/RAG_Knowledge_ Agent_System_2/uploads3
# 单个上传文件的最大大小
spring.servlet.multipart.max-file-size=50MB
# 单次请求总大小上限（多文件上传时需大于等于单文件上限）
spring.servlet.multipart.max-request-size=55MB

# ==================== JWT 配置 ====================
# JWT 签名密钥（长度需 >= 32 字节；生产环境务必更换为更安全的随机值）
jwt.secret=java1234-rag-knowledge-base-secret-key-change-in-prod-min-32bytes!!
# Token 有效期（单位：小时）
jwt.expire-hours=24
